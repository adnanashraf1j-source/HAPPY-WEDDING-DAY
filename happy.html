<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congratulations on Your Wedding!</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
    }

    /* Background Mountain View */
    .background {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.6), rgba(30, 41, 59, 0.8)),
                  url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Canvas for Rain Animation */
    #rainCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Content Overlay */
    .content {
      position: relative;
      z-index: 2;
      padding: 20px;
      backdrop-filter: blur(3px);
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      max-width: 90%;
    }

    /* Blinking & Glowing Congratulations Text */
    .congrats-text {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
      animation: gentleBlink 2.5s infinite ease-in-out;
    }

    .sub-text {
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      color: #e2e8f0;
      letter-spacing: 1.5px;
      font-style: italic;
    }

    /* Gentle Glow & Blink Keyframes */
    @keyframes gentleBlink {
      0%, 100% {
        opacity: 1;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
                     0 0 20px rgba(255, 215, 0, 0.6),
                     0 0 30px rgba(255, 215, 0, 0.4);
      }
      50% {
        opacity: 0.3;
        text-shadow: 0 0 2px rgba(255, 255, 255, 0.2);
      }
    }
  </style>
</head>
<body>

  <div class="background">
    <!-- Rain Overlay Canvas -->
    <canvas id="rainCanvas"></canvas>

    <!-- Main Message Card -->
    <div class="content">
      <h1 class="congrats-text">Congratulations on Your Wedding!</h1>
      <p class="sub-text">Wishing you a lifetime of love, joy, and beautiful adventures together.</p>
    </div>
  </div>

  <script>
    // Rain Animation Script
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const raindrops = [];
    const maxDrops = 300;

    for (let i = 0; i < maxDrops; i++) {
      raindrops.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: Math.random() * 20 + 10,
        speed: Math.random() * 10 + 10,
        opacity: Math.random() * 0.4 + 0.1
      });
    }

    function drawRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 1.2;
      ctx.lineCap = 'round';

      for (let i = 0; i < maxDrops; i++) {
        const drop = raindrops[i];

        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x, drop.y + drop.length);
        ctx.stroke();

        drop.y += drop.speed;

        // Reset raindrop to top when it reaches bottom
        if (drop.y > canvas.height) {
          drop.y = -drop.length;
          drop.x = Math.random() * canvas.width;
        }
      }

      requestAnimationFrame(drawRain);
    }

    drawRain();
  </script>
</body>
</html>
